name: laravel
containerPort: 80
image:
  repository: laravel-app
  tag: '1.0.0'
appSecret: laravel-secret
dbSecret: laravel-db-secret
config:
  APP_NAME: Inventario
  APP_ENV: production
  APP_DEBUG: false
  APP_URL: https://laravel.192-168-0-18.sslip.io
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: laravel-db
  DB_PORT: 3306
  DB_DATABASE: inventario
  DB_USERNAME: appuser
  SESSION_DRIVER: database
  CACHE_STORE: database
probes:
  readiness: /up
  liveness: /up
migrate:
  enabled: true
  command: php artisan migrate --force
ingress:
  host: laravel.192-168-0-18.sslip.io
db:
  image: mysql:8.4
  port: 3306
  mountPath: /var/lib/mysql
  readyCmd:
    - sh
    - -c
    - mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD
metrics:
  probe:
    path: /productos
