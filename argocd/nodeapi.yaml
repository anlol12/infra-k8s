apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodeapi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anlol12/infra-k8s.git
    targetRevision: main
    path: charts/webapp
    helm:
      valueFiles:
      - values-node.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: app-node
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
